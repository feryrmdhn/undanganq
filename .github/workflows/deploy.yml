name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync env database ke Vercel project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_NEW }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          MYSQL_URL_STRING: ${{ secrets.MYSQL_URL_STRING }}
        run: |
          if [ -z "$MYSQL_URL_STRING" ]; then
            echo "::error::Secret MYSQL_URL_STRING belum di-set di GitHub"
            exit 1
          fi
          # hapus dulu bila sudah ada (agar idempotent), lalu tambahkan versi terbaru
          echo "y" | npx vercel env rm MYSQL_URL_STRING production --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
          printf '%s' "$MYSQL_URL_STRING" | npx vercel env add MYSQL_URL_STRING production --token "$VERCEL_TOKEN"

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_NEW }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
